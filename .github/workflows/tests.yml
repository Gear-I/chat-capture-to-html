# Tests for chat-capture-to-html.
#
# Runs the pytest suite, including the end-to-end tests on synthetic
# captures from tests/make_fixture.py, on the minimum supported Python
# version and the newest versions tested so far. These tests use synthetic
# data only; they do not establish forensic validity (CLAUDE.md Section 5).
# Actions are pinned to full commit SHAs.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Tesseract with German and English
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng fonts-dejavu-core
          tesseract --version
          tesseract --list-langs

      - name: Install package
        run: python -m pip install ".[test,live]"

      - name: Run tests
        run: python -m pytest -v
