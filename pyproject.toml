[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-capture-to-html"
version = "0.4.0"
description = "Turn a UFADE Chat capture folder into a hash-linked HTML chat using offline OCR"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["numpy", "pillow", "opencv-python-headless"]

[project.optional-dependencies]
rapidocr = ["rapidocr-onnxruntime"]
test = ["pytest"]

[project.scripts]
chat-capture-to-html = "chat_capture_to_html.cli:main"

[project.gui-scripts]
chat-capture-to-html-gui = "chat_capture_to_html.gui:main"

[tool.setuptools]
packages = ["chat_capture_to_html"]

[tool.setuptools.package-data]
chat_capture_to_html = ["logo.svg", "logo_64.png"]
